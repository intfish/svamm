[package]
name = "svamm"
version = "1.3.2"
edition = "2024"
description = "a sandboxing thing"
license = "MIT"
repository = "https://github.com/intfish/svamm"

[lib]
name = "svamm"
path = "src/lib.rs"

[[bin]]
name = "svamm"
path = "src/main.rs"

[dependencies]
microsandbox = { version = "=0.7.11", default-features = false, features = ["local", "net", "download-binaries"] }
microsandbox-cli = { version = "=0.7.11", default-features = false, features = ["net", "download-binaries"] }
microsandbox-image = "=0.7.11"
microsandbox-types = "=0.7.11"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "7.0"
ureq = { version = "3", features = ["json"] }
console = "0.16"
anyhow = "1.0"
tempfile = "3.15"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
sha2 = "0.11"
tempfile = "3.15"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde_json = "1.0"
anyhow = "1.0"
